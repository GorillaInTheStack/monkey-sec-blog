services:
  hugo:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: blog-dev
    ports:
      - "1313:1313"
    volumes:
      - .:/site
    command: >
      hugo server
      --bind 0.0.0.0
      --baseURL http://localhost
      --logLevel debug
      --disableFastRender
      --poll 700ms
      --cleanDestinationDir
