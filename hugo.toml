baseURL = "https://blog.securitymonkeys.org"
# [en, zh-cn, fr, ...] determines default content language
defaultContentLanguage = "en"
# language code
languageCode = "en"
title = "🐵🍌🌵"
dateFormat = "2006-01-02"
# Change the default theme to be use when building the site with Hugo
theme = "DoIt"

[params]
# DoIt theme version
version = "0.4.1"
defaultTheme = "dark"
enablePWA = false

images = ["favicon.svg"]

description = "A blog about security and anything I find interesting."
# site keywords
keywords = [
  "security",
  "cryptohraphy",
  "blog",
  "exploits",
  "hacking",
  "programming",
  "web security",
  "vulnerability",
  "DevOps",
  "IoT security",
  "Security protocols",
]
license = '<a rel="license external nofollow noopener noreffer" href="https://creativecommons.org/licenses/by-nc/4.0/" target="_blank">CC BY-NC 4.0</a>'

#[params.author]
#name = "Sam"
#email = "sam66ish.eng+blog@gmail.com"
#link = "https://github.com/GorillaInTheStack"
#avatar = "/images/gorilla.webp"
#gravatarEmail = ""

# Home page config
[params.home]
# DoIt NEW | 0.2.0 amount of RSS pages
rss = 10
# Home page profile
[params.home.profile]
enable = true
# Gravatar Email for preferred avatar in home page
gravatarEmail = ""
# URL of avatar shown in home page
avatarURL = "/images/monke-smile.webp"
# URL the avatar links to
avatarLinkURL = "https://github.com/GorillaInTheStack"
# DoIt CHANGED | 0.2.7 title shown in home page (HTML format is supported)
title = "Welcome to the Jungle 🐵🍌🌵"
# subtitle shown in home page
subtitle = "Where bananas? 🍌🪤"
# whether to use typeit animation for subtitle
typeit = true
# whether to show social links
social = true
# DoIt NEW | 0.2.0 disclaimer (HTML format is supported)
disclaimer = ""
# Home page posts
[params.home.posts]
enable = true
# special amount of posts in each home posts page
paginate = 6
# DoIt DELETED | 0.2.0 replaced with hiddenFromHomePage in params.page
# default behavior when you don't set "hiddenFromHomePage" in front matter
defaultHiddenFromHomePage = false


# DoIt NEW | 0.2.0 List (category or tag) page config
[params.list]
# special amount of posts in each list page
paginate = 20
# date format (month and day)
dateFormat = "01-02"
# amount of RSS pages
rss = 10

[params.social]
GitHub = "GorillaInTheStack"
Linkedin = "hussam-alkh"
Email = "sam66ish.eng+blog@gmail.com"
RSS = true

[params.app]
# optional site title override for the app when added to an iOS home screen or Android launcher
title = "MonkeySecBlog"
# whether to omit favicon resource links
noFavicon = false
# modern SVG favicon to use in place of older style .png and .ico files
svgFavicon = "favicon.svg"
# Safari mask icon color
iconColor = "#5bbad5"
# Windows v8-10 tile color
tileColor = "#da532c"

[params.search]
enable = true
# type of search engine ("algolia", "fuse")
type = "fuse"
# max index length of the chunked content
contentLength = 4000
# placeholder of the search bar
placeholder = ""
# DoIt NEW | 0.2.1 max number of results length
maxResultLength = 10
# DoIt NEW | 0.2.3 snippet length of the result
snippetLength = 30
# DoIt NEW | 0.2.1 HTML tag name of the highlight part in results
highlightTag = "em"
# DoIt NEW | 0.2.4 whether to use the absolute URL based on the baseURL in search index
absoluteURL = false

[params.search.fuse]
# DoIt NEW | 0.2.12 https://fusejs.io/api/options.html
isCaseSensitive = false
minMatchCharLength = 2
findAllMatches = false
location = 0
threshold = 0.3
distance = 100
ignoreLocation = false
useExtendedSearch = false
ignoreFieldNorm = false


[params.image]
# cache remote images for better optimisations
cacheRemote = true
# Image resizing and optimisation
optimise = true
# Header config

[params.header]
# DoIt NEW | 0.2.11 Theme change mode
# theme change mode ("switch", "select")
themeChangeMode = "select"
# DoIt NEW | 0.2.0 Header title config

[params.header.title]
# URL of the LOGO
logo = "favicon.svg"
# title name
name = ""
# you can add extra information before the name (HTML format is supported), such as icons
pre = ""
# you can add extra information after the name (HTML format is supported), such as icons
post = ""
# DoIt NEW | 0.2.5 whether to use typeit animation for title name
typeit = true

# Footer config
[params.footer]
enable = true
# DoIt NEW | 0.2.0 Custom content (HTML format is supported)
custom = ''
# DoIt NEW | 0.2.0 whether to show Hugo and theme info
hugo = true
# DoIt NEW | 0.2.14 Hosted on (HTML format is supported)
# <a title="Github Pages" href="https://docs.github.com/en/pages/" target="_blank" rel="noopener noreffer">GitHub Pages</a>
hostedOn = ''
# DoIt NEW | 0.2.0 whether to show copyright info
copyright = true
# DoIt NEW | 0.2.0 whether to show the author
author = true
# Site creation time
since = 2025
# license info (HTML format is supported)
license = '<a rel="license external nofollow noopener noreffer" href="https://creativecommons.org/licenses/by-nc/4.0/" target="_blank">CC BY-NC 4.0</a>'

[params.section]
# special amount of posts in each section page
paginate = 20
# date format (month and day)
dateFormat = "01-02"
# amount of RSS pages
rss = 10
# DoIt NEW | 0.2.13 recently updated posts settings
[params.section.recentlyUpdated]
enable = false
rss = false
days = 30
maxCount = 10

[params.analytics]
enable = true
# Google Analytics
[params.analytics.google]
id = "G-6YW69MXXTN"
# whether to anonymize IP
anonymizeIP = true


# DoIt CHANGED | 0.2.0 Page config
[params.page]
# DoIt NEW | 0.2.0 whether to hide a page from home page
hiddenFromHomePage = false
# DoIt NEW | 0.2.0 whether to hide a page from search results
hiddenFromSearch = false
# DoIt NEW | 0.2.0 whether to enable twemoji
twemoji = false
# whether to enable lightgallery
lightgallery = false
# DoIt NEW | 0.2.0 whether to enable the ruby extended syntax
ruby = true
# DoIt NEW | 0.2.0 whether to enable the fraction extended syntax
fraction = true
# whether to show link to Raw Markdown content of the content
linkToMarkdown = false
# DoIt NEW | 0.2.14 configure the link to the source file of the post
linkToSource = false
# "https://github.com/user/repo/blob/main/{path}"
# DoIt NEW | 0.2.13 configure the link to edit the post
linkToEdit = false
# "https://github.com/user/repo/edit/main/{path}"
# "https://gitlab.com/user/repo/-/edit/main/{path}"
# "https://bitbucket.org/user/repo/src/main/{path}?mode=edit"
# DoIt NEW | 0.2.14 configure the link to report issue for the post
linkToReport = false
# "https://github.com/user/repo/issues/new?title=[bug]%20{title}&body=|Field|Value|%0A|-|-|%0A|Title|{title}|%0A|Url|{url}|%0A|Filename|https://github.com/user/repo/blob/main/{path}|"
# DoIt NEW | 0.2.4 whether to show the full text content in RSS
rssFullText = false
# DoIt NEW | 0.2.13 whether to enable series navigation
seriesNavigation = true
# whether to enable last modified time
enableLastMod = true
# whether to enable word count
enableWordCount = true
# whether to enable reading time estimation
enableReadingTime = true
# DoIt NEW | 0.2.13 outdated article reminder config
[params.page.outdatedArticleReminder]
enable = false
# Display the reminder if the last modified time is more than 90 days ago.
reminder = 90
# Display warning if the last modified time is more than 180 days ago.
warning = 180
# DoIt NEW | 0.2.0 Table of the contents config
[params.page.toc]
# whether to enable the table of the contents
enable = true
# DoIt NEW | 0.2.9 whether to keep the static table of the contents in front of the post
keepStatic = true
# whether to make the table of the contents in the sidebar automatically collapsed
auto = true
# DoIt CHANGED | 0.2.0 KaTeX mathematical formulas
[params.page.math]
enable = true
# default block delimiter is $$ ... $$ and \\[ ... \\]
blockLeftDelimiter = ""
blockRightDelimiter = ""
# default inline delimiter is $ ... $ and \\( ... \\)
inlineLeftDelimiter = ""
inlineRightDelimiter = ""
# KaTeX extension copy_tex
copyTex = true
# KaTeX extension mhchem
mhchem = true
# Use MathJax instead of KaTeX
mathjax = false
# DoIt NEW | 0.2.0 Code configure
[params.page.code]
# the maximum number of lines of displayed code by default
maxShownLines = 10
# whether to enable line numbers in the code block
lineNos = true
# whether to enable line wrapping in the code block
wrap = false
# whether to display the header in the code block
header = true
# DoIt NEW | 0.2.14 Table config
[params.page.table]
# whether to enable sorting in the tables
sort = true
# DoIt NEW | 0.2.0 Mapbox GL JS config
[params.page.mapbox]
# access token of Mapbox GL JS
accessToken = ""
# style for the light theme
lightStyle = "mapbox://styles/mapbox/light-v9"
# style for the dark theme
darkStyle = "mapbox://styles/mapbox/dark-v9"
# whether to add NavigationControl
navigation = true
# whether to add GeolocateControl
geolocate = true
# whether to add ScaleControl
scale = true
# whether to add FullscreenControl
fullscreen = true
# DoIt CHANGED | 0.2.0 social share links in post page
[params.page.share]
enable = true
Twitter = true
Facebook = true
Linkedin = true
Whatsapp = true
Pinterest = false
Tumblr = false
HackerNews = false
Reddit = true
VK = false
Buffer = false
Xing = false
Line = false
Instapaper = false
Pocket = false
Digg = false
Stumbleupon = false
Flipboard = false
Weibo = false
Renren = false
Myspace = false
Blogger = false
Baidu = false
Odnoklassniki = false
Evernote = false
Skype = false
Trello = false
Mix = false
Mastodon = true
# server for PlantUML online rendering
[params.page.plantuml]
server = "https://www.plantuml.com/plantuml"

[params.page.comment]
enable = true
# Disqus comment config
[params.page.comment.disqus]
# DoIt NEW | 0.1.1
enable = false
# Disqus shortname to use Disqus in posts
shortname = ""
# Gitalk comment config
[params.page.comment.gitalk]
# DoIt NEW | 0.1.1
enable = true
owner = "GorillaInTheStack"
repo = "blog-comments"
clientId = ""
clientSecret = ""

[params.page.seo]
# image URL
images = ["favicon.svg"]
# Publisher info
[params.page.seo.publisher]
name = "Monkey Security Blog"
logoUrl = "favicon.svg"
# DoIt NEW | 0.2.14 Related content config
[params.page.related]
enable = true
count = 5

# DoIt NEW | 0.2.13 Sponsor config
[params.sponsor]
enable = true
bio = "Consider supporting my coffee additction"
link = "https://buymeacoffee.com/samish66"       # The link to your sponsor page
custom = ""                                      # Custom HTML button

[params.verification]
google = "G-6YW69MXXTN"
bing = ""
yandex = ""
pinterest = ""
baidu = ""
so = ""                 # 360 search
sogou = ""

[params.seo]
# image URL
